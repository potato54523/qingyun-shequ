<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="HTML/log in/log in.css">
<link rel="stylesheet" href="HTML/log in/input-log-in.css">
<title>青云社区</title>
<style>
@font-face{
    font-family: "TTFFont";
    src: url("assets/ttf/黑体\(1\).ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
    font-display: swap
}
body{
    background-color: #dfecff;
    background-size: cover;
}
.title1{
    font-size:30px;
    left:50%;
    transform: translateX(-50%);
    position: absolute;
    z-index: 1;
    margin-top:30px;
    font-family: "TTFFont",sans-serif;
    -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.title2{
    font-size:20px;
    left:50%;
    transform: translateX(-50%);
    position: absolute;
    margin-top:70px;
    z-index: 1;
    -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}




.window2{
    font-size:15px;
    position: absolute;
    left:50%;
    transform: translateX(-50%);
    background-color:#cadfff;
    height:600px;
    width:500px;
    border-radius:10px;
    box-shadow:10px 10px 50px -30px;
    z-index: 0;
    -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

</style>
</head>
<body>
<input type="text" id="name" class="name-log-in">
<p class = "title1">青云社区</p>
<p class = "title2">现在登录你的账户</p>
<p class = "window2"> </p>
<p class="name-text">用户名</p>
<button class="ripple-btn">注册</button>
<button class="ripple-btn1" id="readBtn">登录</button>

<div id="result">等待读取...</div>
</body>

<script src="HTML/log in/log in.js"></script>
<script>

         // 获取页面元素
         const readBtn = document.getElementById('readBtn');
         const resultDom = document.getElementById('result');
         // 点击按钮，请求后端 read.js 接口
         readBtn.onclick = async function(){
             try{
                 resultDom.innerText = "正在读取...";
                 // 请求Cloudflare Pages后端接口，前端看不到数据库id、密钥
                 const res = await fetch('/date/login.js');
                 const data = await res.json();
                 if(res.ok){
                     // 成功，展示拿到的jsonb数据
                     resultDom.innerText = JSON.stringify(data, null, 2);
                 }else{
                     resultDom.innerText = `读取失败：${data.msg}`;
                 }
             }catch(err){
                 resultDom.innerText = `网络错误：${err.message}`;
             }
         }
</script>
